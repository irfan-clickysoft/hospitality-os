# Local development database (PostgreSQL 16). Data persists in the named volume.
#   docker compose up -d db
#   PGSUPERUSER_URL=postgres://postgres:postgres@localhost:5432/postgres bash scripts/bootstrap-db.sh
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["hos_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hos_pgdata:
