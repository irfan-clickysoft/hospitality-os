# The same system, for a server that ALREADY has a web server on ports 80/443 (other sites, other stagings).
# Nothing here claims 80 or 443: the staff app + API are published only on 127.0.0.1:${HOS_LOCAL_PORT:-8081}, plain http, and the existing proxy
# sends your domain to that port and does the HTTPS (see "A server that already runs other sites" in docs/hosting.md).
# Use a project name so it can never mix with another stack on the same Docker:
#   docker compose -p hos-pms -f deploy/docker-compose.shared.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: ["hos_pgdata:/var/lib/postgresql/data"]      # a volume of this project only (named hos-pms_hos_pgdata); no database port is published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:16
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGSUPERUSER_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      HOS_OWNER_PASSWORD: ${HOS_OWNER_PASSWORD:?}
      HOS_APP_PASSWORD: ${HOS_APP_PASSWORD:?}
      HOS_ADMIN_PASSWORD: ${HOS_ADMIN_PASSWORD:?}
    volumes: ["../scripts/bootstrap-prod-db.sh:/bootstrap.sh:ro"]
    entrypoint: ["bash", "/bootstrap.sh"]

  api:
    build: { context: .., target: api }
    init: true
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL_OWNER: postgres://hos_owner:${HOS_OWNER_PASSWORD}@db:5432/hos
      DATABASE_URL_APP: postgres://hos_app:${HOS_APP_PASSWORD}@db:5432/hos
      DATABASE_URL_ADMIN: postgres://hos_admin:${HOS_ADMIN_PASSWORD}@db:5432/hos
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in deploy/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}}
      MFA_ISSUER: ${MFA_ISSUER:-Hospitality OS}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SES_REGION: ${SES_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${SITE_ADDRESS}}
      RUN_MIGRATIONS: "1"
      HOS_TEST_COPY: ${HOS_TEST_COPY:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [api]
    ports: ["${HOS_BIND:-127.0.0.1}:${HOS_LOCAL_PORT:-8081}:80"]
    environment:
      SITE_ADDRESS: ":80"                                   # plain http inside; HTTPS is done by the proxy in front

volumes:
  hos_pgdata:
