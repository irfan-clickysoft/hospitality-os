name: Deploy to staging
# Builds the images on GitHub's machines, publishes them to GitHub's container registry and deploys them to the
# shared staging server. Runs on every push to main, or by hand (Actions > Deploy to staging > Run workflow,
# choosing the branch to deploy).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/irfan-clickysoft/hospitality-os-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Staff app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/irfan-clickysoft/hospitality-os-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.SSH_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/deploy_key; chmod 600 ~/.ssh/deploy_key; printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          $SSH "$TARGET" "mkdir -p /opt/hospitality"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -r deploy/staging/docker-compose.yml deploy/staging/deploy.sh deploy/staging/postgres-init "$TARGET:/opt/hospitality/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/staging/site.caddy "$TARGET:/opt/edge/sites/hospitality.caddy"
          printf '%s' "$TOKEN" | $SSH "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          $SSH "$TARGET" "chmod +x /opt/hospitality/deploy.sh && /opt/edge/reload.sh && /opt/hospitality/deploy.sh '$TAG'"
